<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="WatchTower — Error Detail. View full context, stack trace, and timeline for a specific application error." />
  <title>Error Detail</title>

  <link rel="stylesheet" href="styles/globals.css" />
  <link rel="stylesheet" href="styles/components.css" />
  <link rel="stylesheet" href="styles/layout.css" />
  <link rel="stylesheet" href="styles/pages.css" />
  <script src="scripts/pages/errorDetail/errorDetail.js" type="module"></script>
</head>

<body>
  <!-- ── App Shell ──────────────────────────────────────────────── -->
  <div id="app">

    <!-- Left sidebar (injected by navbar.js) -->
    <div id="navbar-root"></div>

    <!-- ── Main Content ──────────────────────────────────────────── -->
    <main id="main-content">

      <!-- Back link + page header -->
      <header class="detail-header">
        <a id="back-link" href="error-list.html" class="detail-back-link" aria-label="Back to Error List">
          <svg width="16" height="16" viewBox="0 0 20 20" fill="none" aria-hidden="true">
            <path d="M12.5 15l-5-5 5-5" stroke="currentColor" stroke-width="1.5"
                  stroke-linecap="round" stroke-linejoin="round"/>
          </svg>
          Back to Error List
        </a>

        <div class="detail-header__row">
          <h1 class="page-title">Error Detail</h1>
          <button id="resolve-btn" class="btn btn--dark" aria-label="Mark this error as resolved">
            Mark Resolved
          </button>
        </div>
      </header>

      <!-- Detail content (populated by errorDetail.js) -->
      <div id="detail-root"></div>

    </main>

    <div id="toast"></div>
  </div><!-- /#app -->
</body>

</html>
