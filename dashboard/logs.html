<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="WatchTower — Log Viewer. Browse, filter, and inspect structured log entries from your services in real time." />
  <title>Logs</title>

  <script>
    if (localStorage.getItem('wt-theme') === 'dark') {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  </script>

  <link rel="stylesheet" href="styles/globals.css" />
  <link rel="stylesheet" href="styles/components.css" />
  <link rel="stylesheet" href="styles/layout.css" />
  <link rel="stylesheet" href="styles/pages/logs.css" />
  <script src="scripts/pages/logs/logs.js" type="module"></script>
</head>

<body>
  <div id="app">
    <div id="navbar-root"></div>

    <main id="main-content">
      <header class="page-header">
        <h1 class="page-title">Log Viewer</h1>
        <div class="logs-header-actions">
          <button id="logs-refresh-btn" class="btn btn--outline" type="button" aria-label="Refresh logs">
            <svg width="15" height="15" viewBox="0 0 20 20" fill="none" aria-hidden="true">
              <path d="M17.5 10A7.5 7.5 0 1 1 10 2.5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/>
              <path d="M10 2.5 13.333 5.833 10 9.167" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/>
            </svg>
            Refresh
          </button>
          <label class="logs-auto-refresh-label" for="logs-auto-refresh-toggle">
            <span class="logs-auto-refresh-text">Auto-refresh</span>
            <button
              id="logs-auto-refresh-toggle"
              class="logs-toggle"
              role="switch"
              aria-checked="false"
              type="button"
              aria-label="Toggle auto-refresh every 30 seconds"
            >
              <span class="logs-toggle__thumb"></span>
            </button>
          </label>
        </div>
      </header>

      <!-- Summary Stats -->
      <section id="logs-stats-container" aria-label="Log summary statistics"></section>

      <!-- Filters -->
      <section class="filters" aria-label="Log filters">
        <!-- Level pills -->
        <div class="filter-group">
          <span class="filter-label">Level</span>
          <div class="logs-level-pills" role="group" aria-label="Filter by level">
            <button class="logs-pill logs-pill--active" data-level="all"  id="pill-all"   type="button">All</button>
            <button class="logs-pill logs-pill--info"   data-level="info" id="pill-info"  type="button">Info</button>
            <button class="logs-pill logs-pill--warn"   data-level="warn" id="pill-warn"  type="button">Warn</button>
            <button class="logs-pill logs-pill--error"  data-level="error" id="pill-error" type="button">Error</button>
          </div>
        </div>

        <!-- Time range -->
        <div class="filter-group">
          <label class="filter-label" for="filter-time">Time Range</label>
          <select id="filter-time" class="filter-select">
            <option value="1h">Last 1 hour</option>
            <option value="24h" selected>Last 24 hours</option>
            <option value="7d">Last 7 days</option>
            <option value="30d">Last 30 days</option>
          </select>
        </div>

        <!-- Page size -->
        <div class="filter-group">
          <label class="filter-label" for="filter-limit">Per page</label>
          <select id="filter-limit" class="filter-select">
            <option value="20" selected>20</option>
            <option value="50">50</option>
            <option value="100">100</option>
          </select>
        </div>
      </section>

      <!-- Log Table -->
      <section class="logs-card" aria-label="Log entries">
        <div class="logs-card__header">
          <h2 class="logs-card__title">Entries</h2>
          <span class="logs-count-badge" id="logs-count-badge" aria-live="polite"></span>
        </div>

        <div id="logs-table-wrap" class="logs-table-wrap" aria-live="polite" aria-label="Log table">
          <!-- Populated by logs.js -->
        </div>
      </section>

      <!-- Pagination -->
      <nav class="pagination" id="logs-pagination" aria-label="Log pagination" style="display:none;">
        <button id="logs-prev-btn" class="btn btn--outline" type="button">← Prev</button>
        <span class="pagination__info" id="logs-page-info" aria-live="polite"></span>
        <button id="logs-next-btn" class="btn btn--outline" type="button">Next →</button>
      </nav>
    </main>

    <!-- Log Detail Drawer -->
    <aside id="logs-drawer" class="logs-drawer" aria-label="Log detail" aria-hidden="true" hidden>
      <div class="logs-drawer__backdrop" id="logs-drawer-backdrop"></div>
      <div class="logs-drawer__panel" role="dialog" aria-modal="true" aria-labelledby="logs-drawer-title">
        <div class="logs-drawer__header">
          <h2 class="logs-drawer__title" id="logs-drawer-title">Log Detail</h2>
          <button class="logs-drawer__close" id="logs-drawer-close" type="button" aria-label="Close log detail">
            <svg width="18" height="18" viewBox="0 0 20 20" fill="none" aria-hidden="true">
              <path d="M5 5l10 10M15 5 5 15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
            </svg>
          </button>
        </div>
        <div class="logs-drawer__body" id="logs-drawer-body">
          <!-- Populated dynamically -->
        </div>
      </div>
    </aside>

    <div id="toast"></div>
  </div>
  <script src="scripts/utils/themeToggle.js"></script>
</body>

</html>
