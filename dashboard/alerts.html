<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="WatchTower Alert Settings. Configure your notification preferences." />
  <title>Alert Settings</title>

  <link rel="stylesheet" href="styles/globals.css" />
  <link rel="stylesheet" href="styles/components.css" />
  <link rel="stylesheet" href="styles/layout.css" />
  <link rel="stylesheet" href="styles/pages/alerts.css" />
  
  <script src="scripts/pages/alerts/alerts.js" type="module"></script>
  <script>
    if (localStorage.getItem('wt-theme') === 'dark') {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  </script>
</head>

<body>
  <div id="app">
    <div id="navbar-root"></div>

    <main id="main-content">
      <header class="page-header alerts-header">
        <div>
          <h1 class="page-title">Alert Settings</h1>
        </div>
      </header>

      <section class="alerts-panel">
        <div class="alert-setting">
          <div class="alert-setting__info">
            <h2 class="alert-setting__title">Email Notifications</h2>
            <p class="alert-setting__desc">Daily Error Report</p>
          </div>
          <label class="toggle-switch">
            <input type="checkbox" id="email-notifications-toggle" aria-label="Toggle Email Notifications" disabled>
            <span class="toggle-slider"></span>
          </label>
        </div>
      </section>
    </main>
  </div>
  <script src="scripts/utils/themeToggle.js"></script>
</body>

</html>
