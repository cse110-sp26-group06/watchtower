<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="WatchTower sign-in. Access the observability dashboard." />
  <title>WatchTower Sign In</title>

  <link rel="stylesheet" href="styles/globals.css" />
  <link rel="stylesheet" href="styles/components.css" />
  <link rel="stylesheet" href="styles/layout.css" />
  <link rel="stylesheet" href="styles/pages/login.css" />
  <script src="scripts/pages/login/login.js?v=login-ready" type="module"></script>
  <script>
    if (localStorage.getItem('wt-theme') === 'dark') {
      document.documentElement.setAttribute('data-theme', 'dark');
    }
  </script>
  
</head>

<body class="login-page">
  <main class="login-shell">
    <section class="login-hero" aria-labelledby="login-heading">
      <div class="login-hero__brand">
        <h1 id="login-heading" class="login-hero__title">WatchTower</h1>
        <p class="login-hero__subtitle">Observability Dashboard</p>
      </div>

      <form id="login-form" class="login-card" novalidate>
        <h2 class="login-card__title">Sign In</h2>

        <div class="login-field">
          <label class="login-field__label" for="email">Email Address</label>
          <input
            id="email"
            name="email"
            type="email"
            class="login-field__input"
            placeholder="user123@email.com"
            autocomplete="email"
            aria-describedby="email-error"
            aria-invalid="false"
            required
          />
          <p id="email-error" class="login-field__error" aria-live="polite"></p>
        </div>

        <div class="login-field">
          <label class="login-field__label" for="password">Password</label>
          <input
            id="password"
            name="password"
            type="password"
            class="login-field__input"
            placeholder="••••••••"
            autocomplete="current-password"
            aria-describedby="password-error"
            aria-invalid="false"
            minlength="8"
            required
          />
          <p id="password-error" class="login-field__error" aria-live="polite"></p>
        </div>

        <button id="login-submit" type="submit" class="btn btn--dark login-card__submit" disabled>Sign In</button>
      </form>
    </section>
  </main>
  <script src="scripts/utils/themeToggle.js"></script>
</body>

</html>
